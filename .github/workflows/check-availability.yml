name: check-availability

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-availability.ts
      - run: |
          git config user.name "rolodex-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/statuses.json
          if git diff --staged --quiet; then
            echo "No status changes"
            exit 0
          fi
          git commit -m "chore: refresh availability statuses"
          git push
